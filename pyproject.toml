[tool.poetry]
name = "se-interview"
version = "0.1.0"
description = "A simple LangGraph agent with web search capability"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2"
langchain = "^0.3"
langchain-community = "^0.3"
langchain-openai = "^0.2"
ddgs = "^9.0"
python-dotenv = "^1.0"
fastapi = "^0.115"
uvicorn = "^0.32"
arize-phoenix-otel = {version = "0.17.2", python = ">=3.11,<3.15"}
openinference-instrumentation-langchain = {version = "0.1.80", python = ">=3.11,<3.15"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
